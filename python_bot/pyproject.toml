[project]
name = "tezyukla-enterprise-bot"
version = "1.0.0"
description = "Production Telegram media downloader, Shazam, search and admin bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.10,<4",
  "aiofiles>=24.1",
  "aiohttp>=3.9",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "bcrypt>=4.1",
  "fastapi>=0.111",
  "gunicorn>=22.0",
  "httpx>=0.27",
  "orjson>=3.10",
  "pydantic>=2.8",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.30",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "locust>=2.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
