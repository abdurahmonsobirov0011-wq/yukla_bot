version: '3.8'

services:
  app:
    build: .
    container_name: telegram_downloader_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/telegram_downloader_db
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs

  mongo:
    image: mongo:7.0
    container_name: telegram_downloader_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
